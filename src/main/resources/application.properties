spring.application.name=trading

server.port=5455

spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:eaze}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:eazetrading@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

stripe.api.key=${STRIPE_API_KEY:}
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}

# CoinGecko API Configuration
# For Demo plan: base-url=https://api.coingecko.com/api/v3, header-name=x-cg-demo-api-key
# For Pro plan:  base-url=https://pro-api.coingecko.com/api/v3, header-name=x-cg-pro-api-key
coingecko.api.key=${COINGECKO_API_KEY}
coingecko.api.base-url=${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
coingecko.api.header-name=${COINGECKO_HEADER_NAME:x-cg-demo-api-key}

admin.seed.email=${ADMIN_EMAIL:admin@eaze.com}
admin.seed.password=${ADMIN_PASSWORD:someStringPass}
admin.seed.full-name=${ADMIN_FULL_NAME:Administrator}

# JWT signing secret. MUST be provided via the JWT_SECRET env var in real environments.
# The dev fallback below is for local testing only and must be removed before commit.
# Must be at least 32 bytes for HS256.
jwt.secret=${JWT_SECRET:sdfasdfasdfasdfasdfasdfasdfasdfas}

spring.config.import=optional:file:.env[.properties]

