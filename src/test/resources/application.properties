# Test config: use a SEPARATE local MySQL schema (eaze_test) so real `eaze` data is never touched.
# Create it once:  CREATE DATABASE IF NOT EXISTS eaze_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.url=jdbc:mysql://localhost:3306/eaze_test
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway builds the schema from scratch into the empty eaze_test schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Dummy secrets so the context starts without a real .env.
spring.mail.host=localhost
razorpay.api.key=test
razorpay.api.secret=test
coingecko.api.key=test
spring.mail.password=test
jwt.secret=test-jwt-secret-test-jwt-secret-0123456789